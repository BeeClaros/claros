Project ID: SUP-DEMO-1048

Customer: Northpoint Property Group
Site: Northpoint Tower, Dallas, TX
Estimator: Alex Morgan (sample team)
Original quoted price: 1184500

Scope: Remove the existing membrane in the agreed work area | Install the specified TPO roof assembly | Replace perimeter flashing and sheet metal

Company dataset: Supreme Roofing - demo

Job 26-1048: SUP-DEMO-1048 | Northpoint Tower roof replacement | Northpoint Property Group | Northpoint Tower, Dallas, TX | Unstarted
Job 26-1031: SUP-DEMO-1031 | Westlake office repairs | Westlake Property Services | Westlake Office, Fort Worth, TX | In progress

  };
  const docNames = {estimate:'The EDGE · sample export',proposal:'Accepted proposal',setup:'Claros · setup draft',sage:'Sage 300 CRE · sample lookup',amendment:'Start-date revision'};
  const systems = {estimate:'The EDGE',proposal:'Contract document',setup:'Claros',sage:'Sage 300 CRE',amendment:'Contract document'};
  const schemaKeys = {
    estimate:['Document ID','Exported at','Project ID','Project','Customer','Site','Estimator','Original quoted price','Roof area','Scope','Exclusions','Access','Pre-Con review','Pricing breakdown'],
    proposal:['Document ID','Project ID','Contract reference','Status','Contract amount','Start date','Commercial note','Billing basis'],
    setup:['Document ID','Project ID','Contract amount','Project manager'],
    sage:['Document ID','Snapshot captured','Company dataset']

  function read(text) {

    if(!validDate(val(p,'Start date'))) errors.push({doc:'proposal',key:'Start date',message:'Use a valid Start date in YYYY-MM-DD format.'});

    const jobs=[],codes=[],g=parsed.sage;

      const j=key.match(/^job (\S+)$/),c=key.match(/^cost code (\S+)$/);
      if(j){const parts=field.value.split('|').map(x=>x.trim());if(parts.length!==5||parts.some(x=>!x))errors.push({doc:'sage',key,message:'Each Job needs project reference | description | customer | site | status.'});else jobs.push({id:j[1].toUpperCase(),projectRef:parts[0],description:parts[1],customer:parts[2],site:parts[3],status:parts[4],source:source('sage',key)});}
      if(c){const parts=field.value.split('|').map(x=>x.trim());if(parts.length!==3||parts.some(x=>!x))errors.push({doc:'sage',key,message:'Each Cost code needs description | category | status.'});else codes.push({code:c[1].toUpperCase(),description:parts[0],category:parts[1],status:parts[2],source:source('sage',key)});}
    }
    if(!codes.length)errors.push({doc:'sage',key:'Cost codes',message:'At least one cost code is required in the sample lookup.'});
    const record={
      projectId:ids[0], project:val(e,'Project'), customer:val(e,'Customer'),site:val(e,'Site'),estimator:val(e,'Estimator'),
      originalEstimate:original,contractAmount:amount,draftAmount:draft,startDate:val(p,'Start date'),
      contractRef:val(p,'Contract reference'), commercialNote:val(p,'Commercial note'),billing:val(p,'Billing basis'),
      roofArea:val(e,'Roof area'),scope:val(e,'Scope').split('|').map(x=>x.trim()),exclusions:val(e,'Exclusions').split('|').map(x=>x.trim()),
      access:val(e,'Access'),precon:val(e,'Pre-Con review').split('|').map(x=>x.trim()),pricing:val(e,'Pricing breakdown').split('|').map(x=>x.trim()),
      pm:/^(unassigned|none|tbd|pending)$/i.test(pm)?'':pm,costLines,costBudget:Math.round(costLines.reduce((n,l)=>n+l.amount,0)*100)/100,
      sage:{jobs,codes,snapshot:val(g,'Snapshot captured'),version:val(g,'Document ID'),dataset:val(g,'Company dataset')},
      sources:{project:source('estimate','Project'),customer:source('estimate','Customer'),site:source('estimate','Site'),estimator:source('estimate','Estimator'),
        originalEstimate:source('estimate','Original quoted price'),contractAmount:source('proposal','Contract amount'),draftAmount:source('setup','Contract amount'),
        startDate:source('proposal','Start date'),contractRef:source('proposal','Contract reference'),commercialNote:source('proposal','Commercial note'),
        billing:source('proposal','Billing basis'),scope:source('estimate','Scope'),exclusions:source('estimate','Exclusions'),access:source('estimate','Access'),
        roofArea:source('estimate','Roof area'),precon:source('estimate','Pre-Con review'),pricing:source('estimate','Pricing breakdown')}

  }
  function fresh(){return {schema:SCHEMA,step:1,docs:clone(samples),record:null,errors:[],fieldCount:0,review:null,pm:'',jobDecision:null,mappings:{},sync:null,ledger:{receipts:{},jobs:[]},releases:{pm:null,accounting:null},revision:null,events:[],tab:'pm'};}
  function log(s,type,title,detail,actor='Demo reviewer') {

      if(/closed/i.test(job.status))throw Error('This job is closed. Accounting must resolve its status before a handoff can be linked.');

  }
  function mapCost(s,lineId,code){
    if(!s.record||s.releases.pm)throw Error('Open the initial review first.');

  function editSource(id){openModal('Edit '+E(C.docNames[id]),'Keep the field labels. Change their values to test the handoff.',`<label class="sr-only" for="source-editor">Source text</label><textarea id="source-editor" class="source-editor" maxlength="12000" spellcheck="false">${E(state.docs[id])}</textarea><p class="small muted" style="margin-top:12px">This demo reads the labeled text format shown here. Saving changes returns to the documents step and clears any unreleased review.</p>`,button('Cancel','source','',`data-doc="${id}"`)+button('Save sample changes','save-source','primary',`data-doc="${id}"`));}
  function history(){openModal('Review history','Events recorded by this demo in the current browser.',state.events.length?state.events.slice().reverse().map(e=>`<div class="history-row"><div class="meta">${E(e.id)} · ${E(new Date(e.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}))} · ${E(e.actor)}</div><h3>${E(e.title)}</h3><p>${E(e.detail)}</p></div>`).join(''):'<p class="muted">Prepare a handoff to start the review history.</p>');}
  function about(){openModal('A focused demonstration','Version 2 · Sources, review, team packs and delivery confirmation.',`<div class="explanation"><p><strong>What works here</strong><br>Four editable text sources are read by a local parser. The demo checks project references, suggests existing job matches and validates cost codes against the sample lookup. Review decisions update the project record. The PDF, setup CSV, cost CSV and JSON are generated from the approved data.</p><p><strong>System delivery is simulated</strong><br>The local destination holds sample jobs and accepted handoff packages. You can test successful delivery, a connector failure and a lost confirmation. Repeating an accepted submission returns the same confirmation without creating another job or package. This is a property of this simulator, not a verified Sage API feature.</p><p><strong>What is illustrative</strong><br>All projects, people, values, export formats and system records are fictional. This file does not use an AI model, OCR, arbitrary PDF extraction or live system connections. Its files are review outputs, not validated Sage import files or API request schemas.</p><p><strong>Revisions and records</strong><br>A start-date revision requires a PM decision and updates only the PM pack. Roles are demonstration roles. Progress and history stay in this browser when local storage is available. Restart clears this run. No data is sent to a server.</p><p><strong>For a production version</strong><br>Validate actual source exports, job matching, current financial balances, mandatory fields, permissions, connector support and confirmed delivery with Supreme. This demo does not authorize purchases, billing, payroll or production.</p></div>`,button('Integration scope','integration-scope')+button('Back to the demo','close','primary'));}
  function integrationScope(){openModal('Integration scope','Focus the first workflow on the awarded-project handoff.',`<div class="explanation"><p><strong>The EDGE → Claros</strong><br>Use an available estimating export first. Keep the quoted price and estimated costs as source facts. EDGE documents a Timberline interface; compatibility and exported fields need confirmation. <a href="https://www.estimatingedge.com/knowledgebase/interface-reports/" target="_blank" rel="noopener noreferrer">EDGE documentation</a>.</p><p><strong>Sage 300 CRE ↔ Claros</strong><br>Read existing jobs and cost codes where access permits. Prepare approved setup and costs for a supported import or connector. The official guide documents lookup endpoints, but it does not establish a general job/contract/budget write route for this demo. Confirm licensing, partner access and supported operations. <a href="https://docs.sage.com/docs/en/customer/300cre/26/open/Sage300CRE_WebAPI_UserGuide.pdf" target="_blank" rel="noopener noreferrer">Sage API guide</a>.</p><p><strong>Potential next workflows</strong></p><table class="data-table"><tbody><tr><th scope="row">Dataforma</th><td>Service work completion → documentation review → billing preparation. Keep this separate unless a service record belongs in this handoff.</td></tr><tr><th scope="row">EagleView / Pictometry</th><td>Attach an existing measurement report or image when it helps identify the property. No write is needed here.</td></tr><tr><th scope="row">Paperless</th><td>Continue into the established invoice/document approval process when procurement and invoices begin.</td></tr><tr><th scope="row">ExakTime / Arcoro</th><td>Connect field hours and job/cost codes during execution, starting with the connector already available to the team.</td></tr></tbody></table><p style="margin-top:18px">These are potential integration roles. Only the local EDGE/Sage examples are implemented in this HTML.</p></div>`,button('Back to the demo','close','primary'));}
  function download(name,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
    const action=b.dataset.action;
    try{
      if(action==='about')about();
      else if(action==='integration-scope')integrationScope();
      else if(action==='close')$('modal').close();
      else if(action==='reset')openModal('Restart this sample?','Your demo decisions and local review history will be cleared.','<p>The four original sample sources and the local demo destination will be restored.</p>',button('Keep working','close')+button('Restart sample','confirm-reset','primary'));
      else if(action==='confirm-reset'){state=C.fresh();$('modal').close();move();}
      else if(action==='source')showSource(b.dataset.doc,Number(b.dataset.line)||0);
      else if(action==='edit-source')editSource(b.dataset.doc);
      else if(action==='save-source'){if(state.releases.pm)throw Error('Released sources cannot be overwritten.');state.docs[b.dataset.doc]=$('source-editor').value;state.record=null;state.errors=[];state.review=null;state.pm='';state.step=1;$('modal').close();move();toast('Source updated. Prepare the handoff to read the new values.');}
      else if(action==='download-source'){const id=b.dataset.doc;download((id==='pending'?'start-date-revision':id)+'-sample.txt',id==='pending'?state.revision.text:state.docs[id],'text/plain;charset=utf-8');toast('Source text prepared for download.');}
      else if(action==='prepare'){if(C.prepare(state)){move();toast('Project details prepared. Review the outstanding items.');}else{render();$('announce').textContent='Check the source information before proceeding.';}}
      else if(action==='confirm-amount'){C.confirmAmount(state,$('review-note').value);render();toast('Accepted amount confirmed. Source quote and costs preserved.');}
      else if(action==='assign'){C.assign(state,$('pm-choice').value);render();toast('Project Manager assigned to the handoff.');}
      else if(action==='link-job'){C.selectJob(state,b.dataset.job);render();toast('Existing demo job selected. A new job will not be requested.');}
      else if(action==='reopen-job'){state.jobDecision=null;C.log(state,'job_reopened','Job selection reopened','Reviewer requested another look at the matching sample jobs.');render();}
      else if(action==='new-job'){if(C.candidates(state).length){openModal('Why is this a different project?','An existing job candidate needs an explicit review decision.',`<label class="review-input-label" for="new-job-reason">Reason for requesting a separate job</label><textarea id="new-job-reason" maxlength="500" rows="4" placeholder="Explain the difference in scope, contract or project reference."></textarea><p class="small muted" style="margin-top:12px">This records a new job request in the demo. The live destination would need another duplicate check before creation.</p>`,button('Keep reviewing','close')+button('Confirm new job request','confirm-new-job','primary'));}else{C.selectJob(state,'new');render();}}
      else if(action==='confirm-new-job'){C.selectJob(state,'new',$('new-job-reason').value);$('modal').close();render();toast('New job request recorded with your reason.');}
      else if(action==='map-cost'){const id=b.dataset.lineid;C.mapCost(state,id,$('map-'+id.replace(/ /g,'-')).value);render();toast('Cost code confirmed. Estimated costs are unchanged.');}
      else if(action==='preview-release')previewRelease();
      else if(action==='release'){C.release(state);state.tab='delivery';if($('modal').open)$('modal').close();move();toast('Handoff approved. Demo submission is still pending.');}
      else if(action==='simulate-send'){C.simulateSend(state,$('sync-scenario').value);render();toast(state.sync.status==='confirmed'?'Demo destination confirmed the submission.':state.sync.status==='failed'?'Submission failed. Nothing was written.':'Confirmation missing. Retry to recover the same submission.',state.sync.status!=='confirmed');}
      else if(action==='replay-send'){C.simulateSend(state,'success');render();toast('Same confirmation returned. No extra job or package created.');}
      else if(action==='inspect-destination')inspectDestination();
      else if(action==='download-plan'){download(state.record.projectId+'-approved-package.json',JSON.stringify(C.writePlan(state),null,2),'application/json;charset=utf-8');toast('Approved package JSON prepared. This is not a Sage API schema.');}
      else if(action==='step'){const step=Number(b.dataset.step);if(step===1||step===2&&state.record||step===3&&state.releases.pm){state.step=step;move();}}
      else if(action==='tab'){state.tab=b.dataset.tab;render();}
      else if(action==='history')history();
      else if(action==='stage-revision'){const date=$('revision-date').value;C.stageRevision(state,C.revisionText(state,date));state.tab='pm';render();toast('Revision detected. The PM pack needs a new review.');$('announce').textContent='New start date needs PM review. Accounting is unaffected.';}
      else if(action==='revision-source')showSource('pending',state.revision.line);
      else if(action==='accept-revision'){C.decideRevision(state,true);state.tab='pm';render();toast('PM pack updated. Accounting CSV remains unchanged.');}
      else if(action==='reject-revision'){C.decideRevision(state,false,'Current date retained by the demo PM.');render();toast('Current start retained. PM download is available again.');}
      else if(action==='pdf'){const data=C.pdf(state);download(state.record.projectId+'-PM-handoff-v'+state.releases.pm.version+'.pdf',data,'application/pdf');C.log(state,'pdf_export','PM handoff PDF generated','Version '+state.releases.pm.version+'. Ready for download.','Local demo');render();toast('PM handoff PDF prepared for download.');}
      else if(action==='csv'){download(state.record.projectId+'-accounting-v'+state.releases.accounting.version+'.csv',C.csv(state),'text/csv;charset=utf-8');C.log(state,'csv_export','Accounting CSV generated','Generic review export v'+state.releases.accounting.version+'. Sage mapping remains unvalidated.','Local demo');render();toast('Accounting CSV prepared for download.');}
      else if(action==='cost-csv'){download(state.record.projectId+'-cost-budget-v'+state.releases.accounting.version+'.csv',C.costCsv(state),'text/csv;charset=utf-8');C.log(state,'cost_csv_export','Cost budget CSV generated','Source costs preserved with reviewed sample code mappings. Sage import format remains unvalidated.','Local demo');render();toast('Cost budget CSV prepared for download.');}
    }catch(err){toast(err.message||'Something needs attention.',true);}
  });
  $('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close();}});
  document.addEventListener('keydown',e=>{const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=['delivery','pm','accounting'],i=tabs.indexOf(state.tab);state.tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(i+(e.key==='ArrowRight'?1:2))%3];e.preventDefault();render();$('tab-'+state.tab).focus();});
  render();
})();

</script>
</body>
</html>
